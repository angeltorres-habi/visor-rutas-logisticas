<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visor de Rutas Logísticas</title>

  <!-- Leaflet CSS (CDN) -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="app-header">
    <h1>Visor de Rutas Logísticas</h1>
    <span id="ruta-titulo" class="ruta-titulo"></span>
  </header>

  <!-- Overlay de estado: carga, errores o mensajes -->
  <div id="status-overlay" class="status-overlay" hidden>
    <div class="status-box">
      <div id="status-spinner" class="spinner" hidden></div>
      <p id="status-message"></p>
    </div>
  </div>

  <div id="map"></div>

  <!-- Leaflet JS (CDN) -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin="">
  </script>

  <script src="app.js"></script>
</body>
</html>
